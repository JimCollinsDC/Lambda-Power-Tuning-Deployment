AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: I/O-Bound Lambda Function for Power Tuning Demo - ARM64 Architecture

Resources:
  IOBoundFunctionARM:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: power-tuning-demo-io-bound-arm64
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      Architectures:
        - arm64
      Description: I/O-bound function (ARM64/Graviton2) for Lambda Power Tuning demonstration
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          FUNCTION_TYPE: io-bound
          ARCHITECTURE: arm64
      Tags:
        Purpose: PowerTuningDemo
        WorkloadType: IO
        Architecture: ARM64

Outputs:
  FunctionArn:
    Description: ARN of the I/O-bound Lambda function (ARM64)
    Value: !GetAtt IOBoundFunctionARM.Arn
  FunctionName:
    Description: Name of the I/O-bound Lambda function (ARM64)
    Value: !Ref IOBoundFunctionARM
