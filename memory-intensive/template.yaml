AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Memory-Intensive Lambda Function for Power Tuning Demo

Resources:
  MemoryIntensiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: power-tuning-demo-memory-intensive
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      Description: Memory-intensive function for Lambda Power Tuning demonstration
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          FUNCTION_TYPE: memory-intensive
      Tags:
        Purpose: PowerTuningDemo
        WorkloadType: Memory

Outputs:
  FunctionArn:
    Description: ARN of the memory-intensive Lambda function
    Value: !GetAtt MemoryIntensiveFunction.Arn
  FunctionName:
    Description: Name of the memory-intensive Lambda function
    Value: !Ref MemoryIntensiveFunction
