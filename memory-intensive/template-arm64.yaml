AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Memory-Intensive Lambda Function for Power Tuning Demo - ARM64 Architecture

Resources:
  MemoryIntensiveFunctionARM:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: power-tuning-demo-memory-intensive-arm64
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      Architectures:
        - arm64
      Description: Memory-intensive function (ARM64/Graviton2) for Lambda Power Tuning demonstration
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          FUNCTION_TYPE: memory-intensive
          ARCHITECTURE: arm64
      Tags:
        Purpose: PowerTuningDemo
        WorkloadType: Memory
        Architecture: ARM64

Outputs:
  FunctionArn:
    Description: ARN of the memory-intensive Lambda function (ARM64)
    Value: !GetAtt MemoryIntensiveFunctionARM.Arn
  FunctionName:
    Description: Name of the memory-intensive Lambda function (ARM64)
    Value: !Ref MemoryIntensiveFunctionARM
