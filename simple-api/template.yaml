AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Simple API Lambda Function for Power Tuning Demo

Resources:
  SimpleAPIFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: power-tuning-demo-simple-api
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      Description: Simple API function for Lambda Power Tuning demonstration baseline
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          FUNCTION_TYPE: simple-api
      Events:
        HealthCheck:
          Type: Api
          Properties:
            Path: /health
            Method: get
        Echo:
          Type: Api
          Properties:
            Path: /echo
            Method: post
        Info:
          Type: Api
          Properties:
            Path: /info
            Method: get
      Tags:
        Purpose: PowerTuningDemo
        WorkloadType: API

Outputs:
  FunctionArn:
    Description: ARN of the simple API Lambda function
    Value: !GetAtt SimpleAPIFunction.Arn
  FunctionName:
    Description: Name of the simple API Lambda function
    Value: !Ref SimpleAPIFunction
