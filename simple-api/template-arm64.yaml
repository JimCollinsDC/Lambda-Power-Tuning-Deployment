AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Simple API Lambda Function for Power Tuning Demo - ARM64 Architecture

Resources:
  SimpleAPIFunctionARM:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: power-tuning-demo-simple-api-arm64
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      Architectures:
        - arm64
      Description: Simple API function (ARM64/Graviton2) for Lambda Power Tuning demonstration baseline
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          FUNCTION_TYPE: simple-api
          ARCHITECTURE: arm64
      Events:
        HealthCheck:
          Type: Api
          Properties:
            Path: /health
            Method: get
        Echo:
          Type: Api
          Properties:
            Path: /echo
            Method: post
        Info:
          Type: Api
          Properties:
            Path: /info
            Method: get
      Tags:
        Purpose: PowerTuningDemo
        WorkloadType: API
        Architecture: ARM64

Outputs:
  FunctionArn:
    Description: ARN of the simple API Lambda function (ARM64)
    Value: !GetAtt SimpleAPIFunctionARM.Arn
  FunctionName:
    Description: Name of the simple API Lambda function (ARM64)
    Value: !Ref SimpleAPIFunctionARM
