AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Network-Bound Lambda Function for Power Tuning Demo - ARM64 - Demonstrates 2 vCPU Benefit

Resources:
  NetworkBoundFunctionARM:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: power-tuning-demo-network-bound-arm64
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      Architectures:
        - arm64
      Description: Network-bound function (ARM64/Graviton2) demonstrating 2 vCPU threshold (1769+ MB)
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          FUNCTION_TYPE: network-bound
          ARCHITECTURE: arm64
      Tags:
        Purpose: PowerTuningDemo
        WorkloadType: NetworkCPU
        Architecture: ARM64
        Note: Benefits from 2 vCPUs at 1769MB+

Outputs:
  FunctionArn:
    Description: ARN of the network-bound Lambda function (ARM64)
    Value: !GetAtt NetworkBoundFunctionARM.Arn
  FunctionName:
    Description: Name of the network-bound Lambda function (ARM64)
    Value: !Ref NetworkBoundFunctionARM
  MemoryNote:
    Description: vCPU allocation info
    Value: "1 vCPU at <1769 MB, 2 vCPUs at 1769+ MB"
