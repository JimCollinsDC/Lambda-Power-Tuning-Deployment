AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Network-Bound Lambda Function for Power Tuning Demo - Demonstrates 2 vCPU Benefit

Resources:
  NetworkBoundFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: power-tuning-demo-network-bound
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      Description: Network-bound function demonstrating 2 vCPU threshold (1769+ MB)
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          FUNCTION_TYPE: network-bound
      Tags:
        Purpose: PowerTuningDemo
        WorkloadType: NetworkCPU
        Note: Benefits from 2 vCPUs at 1769MB+

Outputs:
  FunctionArn:
    Description: ARN of the network-bound Lambda function
    Value: !GetAtt NetworkBoundFunction.Arn
  FunctionName:
    Description: Name of the network-bound Lambda function
    Value: !Ref NetworkBoundFunction
  MemoryNote:
    Description: vCPU allocation info
    Value: "1 vCPU at <1769 MB, 2 vCPUs at 1769+ MB"
