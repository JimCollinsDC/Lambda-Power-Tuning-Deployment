AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CPU-Intensive Lambda Function for Power Tuning Demo

Resources:
  CPUIntensiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: power-tuning-demo-cpu-intensive
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      Description: CPU-intensive function for Lambda Power Tuning demonstration
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          FUNCTION_TYPE: cpu-intensive
      Tags:
        Purpose: PowerTuningDemo
        WorkloadType: CPU

Outputs:
  FunctionArn:
    Description: ARN of the CPU-intensive Lambda function
    Value: !GetAtt CPUIntensiveFunction.Arn
  FunctionName:
    Description: Name of the CPU-intensive Lambda function
    Value: !Ref CPUIntensiveFunction
