AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CPU-Intensive Lambda Function for Power Tuning Demo - ARM64 Architecture

Resources:
  CPUIntensiveFunctionARM:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: power-tuning-demo-cpu-intensive-arm64
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      Architectures:
        - arm64
      Description: CPU-intensive function (ARM64/Graviton2) for Lambda Power Tuning demonstration
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          FUNCTION_TYPE: cpu-intensive
          ARCHITECTURE: arm64
      Tags:
        Purpose: PowerTuningDemo
        WorkloadType: CPU
        Architecture: ARM64

Outputs:
  FunctionArn:
    Description: ARN of the CPU-intensive Lambda function (ARM64)
    Value: !GetAtt CPUIntensiveFunctionARM.Arn
  FunctionName:
    Description: Name of the CPU-intensive Lambda function (ARM64)
    Value: !Ref CPUIntensiveFunctionARM
